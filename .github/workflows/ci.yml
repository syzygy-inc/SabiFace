name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 純 Rust: 参照環境が無い case は BLOCKED として台帳に残り、skip される
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Ledger without the reference environment (every oracle case is BLOCKED, none PASS)
        run: |
          sh scripts/qa-ledger.sh || true
          if grep -h $'\tPASS\t' target/qa-ledger/*.tsv; then echo "oracle cases must not PASS without TeX Live"; exit 1; fi
      - name: Strict mode must fail without the reference environment (deliberate failure is detected)
        run: |
          rm -rf target/qa-ledger
          if SABI_STRICT_TESTS=1 cargo test --workspace >/dev/null 2>&1; then echo "strict mode passed without TeX Live"; exit 1; fi
          echo "strict mode failed as expected"

  # 参照環境あり: TeX Live の tftopl / uptftopl / vftovp とフォントを導入し、予定した case が全部 PASS することを台帳で確認する
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-binaries texlive-base texlive-fonts-recommended texlive-lang-japanese lmodern
          for f in cmr10.tfm cmr10.pfb cmr10.afm jis.tfm upjisr-h.tfm ptmr7t.vf 8r.enc ec.enc pdftex.map kanjix.map lmr10.pfb; do printf '%s: ' "$f"; kpsewhich "$f" || echo "(missing)"; done
          for t in tftopl uptftopl vftovp; do printf '%s: ' "$t"; which "$t" || echo "(missing)"; done
      - name: Reference resources (lock; required present, digests match the baseline)
        run: sh scripts/qa-resources.sh check
      - name: Test (strict)
        env:
          SABI_STRICT_TESTS: "1"
        run: |
          rm -rf target/qa-ledger
          cargo test --workspace
      - name: Ledger (all planned cases PASS with their comparisons)
        run: sh scripts/qa-ledger.sh
